<meta charset="utf-8">
<title>푸른숲공원 예약 관리 플로우 맵</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Overpass:wght@300;400;600;700;800&family=Overpass+Mono:wght@400;600&display=swap">
<style>
/* 레이아웃: 상단 툴바 · 왼쪽 화면/이슈 패널 · 지형도 점격자 캔버스(메뉴=섹션, 화면=1440×900 프레임) · 오른쪽 인스펙터 · 문서 패널 오버레이 */
:root {
  --canvas: #E4E9E6; --dot: #C6D0CA; --chrome: #FFFFFF; --chrome-2: #F2F5F3; --line: #DEE4E0;
  --fg: #14201B; --fg-2: #56645D; --fg-3: #87948D;
  --accent: #127A5E; --accent-soft: rgba(18, 122, 94, .12); --accent-fg: #FFFFFF;
  --back: #96A39C; --section: rgba(255, 255, 255, .5); --section-line: rgba(20, 32, 27, .08);
  --card: #FFFFFF; --shadow: 0 1px 2px rgba(20, 32, 27, .06), 0 8px 28px rgba(20, 32, 27, .09);
  --high: #C8361F; --high-soft: #FBE9E5; --mid: #A65A07; --mid-soft: #FDF1DF; --low: #4D5E78; --low-soft: #EBEFF5; --good: #127A5E; --good-soft: #E2F3EC;
  --ui: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --canvas: #171C1A; --dot: #29312D; --chrome: #1F2522; --chrome-2: #272E2B; --line: #343D38;
  --fg: #E8EEEA; --fg-2: #A5B2AB; --fg-3: #7B8882;
  --accent: #4FCBA4; --accent-soft: rgba(79, 203, 164, .16); --accent-fg: #06261C;
  --back: #69766F; --section: rgba(255, 255, 255, .025); --section-line: rgba(255, 255, 255, .07);
  --card: #1F2522; --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 8px 28px rgba(0, 0, 0, .35);
  --high: #FF8A73; --high-soft: rgba(255, 138, 115, .14); --mid: #F2B45A; --mid-soft: rgba(242, 180, 90, .14); --low: #A9B6CC; --low-soft: rgba(169, 182, 204, .14); --good: #4FCBA4; --good-soft: rgba(79, 203, 164, .14);
  color-scheme: dark } }
:root[data-theme="dark"] {
  --canvas: #171C1A; --dot: #29312D; --chrome: #1F2522; --chrome-2: #272E2B; --line: #343D38;
  --fg: #E8EEEA; --fg-2: #A5B2AB; --fg-3: #7B8882;
  --accent: #4FCBA4; --accent-soft: rgba(79, 203, 164, .16); --accent-fg: #06261C;
  --back: #69766F; --section: rgba(255, 255, 255, .025); --section-line: rgba(255, 255, 255, .07);
  --card: #1F2522; --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 8px 28px rgba(0, 0, 0, .35);
  --high: #FF8A73; --high-soft: rgba(255, 138, 115, .14); --mid: #F2B45A; --mid-soft: rgba(242, 180, 90, .14); --low: #A9B6CC; --low-soft: rgba(169, 182, 204, .14); --good: #4FCBA4; --good-soft: rgba(79, 203, 164, .14);
  color-scheme: dark }
html, body { height: 100%; overflow: hidden }
body { background: var(--chrome); color: var(--fg); font: 13px/1.5 var(--ui); -webkit-font-smoothing: antialiased }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer }
button:focus-visible, [tabindex]:focus-visible, a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px }
.app { height: 100%; display: grid; grid-template-columns: 268px minmax(0, 1fr) 360px; grid-template-rows: 48px minmax(0, 1fr) }
.top { grid-column: 1 / -1; display: flex; align-items: center; gap: 6px; border-bottom: 1px solid var(--line); background: var(--chrome); padding-left: max(12px, env(safe-area-inset-left, 0px)); padding-right: max(12px, env(safe-area-inset-right, 0px)); min-width: 0 }
.brand { flex: 0 1 auto; display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 14px; white-space: nowrap; min-width: 0; overflow: hidden }
.brand svg { width: 20px; height: 20px; flex: none; color: var(--accent) }
.brand small { font-weight: 500; color: var(--fg-3); font-size: 12px; overflow: hidden; text-overflow: ellipsis }
.spacer { flex: 1 }
.tb { height: 32px; min-width: 32px; padding: 0 10px; border-radius: 8px; display: inline-flex; align-items: center; justify-content: center; gap: 6px; color: var(--fg-2); font-weight: 500; white-space: nowrap }
.tb:hover { background: var(--chrome-2); color: var(--fg) }
.tb[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent) }
.tb.primary { background: var(--accent); color: var(--accent-fg); font-weight: 600 }
.tb.primary:hover { filter: brightness(1.06); background: var(--accent); color: var(--accent-fg) }
.tb svg { width: 16px; height: 16px; flex: none }
.zoomval { font-family: var(--mono); font-size: 12px; min-width: 52px; font-variant-numeric: tabular-nums }
.sep { width: 1px; height: 20px; background: var(--line); margin: 0 4px }
.layers { display: flex; gap: 2px }
@media (max-width: 1480px) { .brand small { display: none } }

.left { border-right: 1px solid var(--line); background: var(--chrome); display: flex; flex-direction: column; min-height: 0 }
.tabs { display: flex; gap: 4px; padding: 8px 10px; border-bottom: 1px solid var(--line) }
.tab { flex: 1; height: 30px; border-radius: 7px; font-weight: 600; color: var(--fg-2) }
.tab[aria-selected="true"] { background: var(--chrome-2); color: var(--fg) }
.scroll { overflow-y: auto; min-height: 0; flex: 1 }
.flow { padding: 6px 6px 10px }
.flow h3 { margin: 0; padding: 8px 8px 4px; font-size: 12px; font-weight: 700; color: var(--fg-2); display: flex; justify-content: space-between; gap: 8px; cursor: pointer; border-radius: 6px }
.flow h3:hover { color: var(--fg) }
.flow h3 span { font-family: var(--mono); font-weight: 500; color: var(--fg-3) }
.item { width: 100%; display: flex; align-items: center; gap: 8px; padding: 6px 8px; border-radius: 7px; text-align: left; color: var(--fg) }
.item:hover { background: var(--chrome-2) }
.item[aria-current="true"] { background: var(--accent-soft) }
.item .id { font-family: var(--mono); font-size: 11px; color: var(--fg-3); width: 26px; flex: none }
.item .nm { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap }
.item .kd { font-size: 11px; color: var(--fg-3); flex: none }
.dot { width: 8px; height: 8px; border-radius: 50%; flex: none }
.dot.high { background: var(--high) } .dot.mid { background: var(--mid) } .dot.low { background: var(--low) } .dot.ok { background: var(--good) }

.stage { position: relative; overflow: hidden; background-color: var(--canvas); touch-action: none; cursor: grab; min-width: 0; -webkit-user-select: none; user-select: none }
svg.edges text { -webkit-user-select: none; user-select: none }
.stage.dragging { cursor: grabbing }
.grid { position: absolute; inset: 0; pointer-events: none; background-image: radial-gradient(var(--dot) 1px, transparent 1.2px) }
.world { position: absolute; left: 0; top: 0; transform-origin: 0 0; will-change: transform }
.section { position: absolute; border-radius: 36px; background: var(--section); box-shadow: inset 0 0 0 1px var(--section-line) }
.section h2 { position: absolute; left: 48px; top: 40px; margin: 0; font-size: 64px; line-height: 1.15; font-weight: 700; letter-spacing: -.01em; white-space: nowrap }
.section h2 b { font-family: var(--mono); font-weight: 600; color: var(--fg-3); font-size: 40px; margin-right: 20px }
.section p { position: absolute; left: 50px; top: 130px; margin: 0; font-size: 28px; color: var(--fg-2); white-space: nowrap }
.frame { position: absolute; width: 1440px }
.frame .ft { position: absolute; left: 2px; bottom: calc(100% + 14px); display: flex; gap: 14px; align-items: baseline; white-space: nowrap; font-size: 26px; font-weight: 600; color: var(--fg-2); cursor: pointer }
.frame .ft b { font-family: var(--mono); font-weight: 600; color: var(--fg-3) }
.frame .ft i { font-style: normal; font-size: 18px; font-weight: 600; padding: 2px 10px; border-radius: 8px; background: var(--chrome-2); color: var(--fg-2) }
.frame.sel .ft, .frame.sel .ft b { color: var(--accent) }
.shot { position: relative; width: 1440px; height: 900px; border-radius: 18px; overflow: hidden; box-shadow: var(--shadow); cursor: pointer }
.frame.sel .shot { box-shadow: 0 0 0 6px var(--accent), var(--shadow) }
.pin { position: absolute; top: -18px; right: -18px; min-width: 44px; height: 44px; padding: 0 14px; border-radius: 22px; display: flex; align-items: center; justify-content: center; gap: 6px; font-weight: 700; font-size: 20px; color: #FFFFFF; box-shadow: 0 0 0 4px var(--canvas); cursor: pointer; z-index: 2 }
.pin.high { background: #C8361F } .pin.mid { background: #B86508 } .pin.low { background: #55667F } .pin.ok { background: #127A5E }
.spec { position: absolute; left: 0; width: 1440px; background: var(--card); border-radius: 24px; box-shadow: var(--shadow); padding: 30px 34px; font-size: 21px; line-height: 1.55; cursor: pointer; display: grid; grid-template-columns: 1.1fr 1fr 1fr; gap: 28px }
.spec h4 { grid-column: 1 / -1; margin: 0; font-size: 28px; font-weight: 700; display: flex; gap: 14px; align-items: baseline; flex-wrap: wrap }
.spec h4 b { font-family: var(--mono); color: var(--fg-3); font-weight: 600; font-size: 22px }
.spec h4 small { font-size: 20px; font-weight: 500; color: var(--fg-2) }
.spec dt { font-size: 16px; font-weight: 700; color: var(--fg-3); letter-spacing: .05em; margin-bottom: 6px }
.spec dd { margin: 0 0 16px }
.spec ul { margin: 0; padding-left: 24px; display: grid; gap: 4px }
.spec .chips { display: flex; gap: 8px; flex-wrap: wrap }
.spec .chips .chip { height: 30px; font-size: 16px; padding: 0 10px }
.chip { display: inline-flex; align-items: center; height: 22px; padding: 0 8px; border-radius: 6px; font-size: 12px; font-weight: 700; white-space: nowrap; flex: none; background: var(--chrome-2); color: var(--fg-2) }
.chip.high { background: var(--high-soft); color: var(--high) } .chip.mid { background: var(--mid-soft); color: var(--mid) } .chip.low { background: var(--low-soft); color: var(--low) } .chip.good { background: var(--good-soft); color: var(--good) } .chip.acc { background: var(--accent-soft); color: var(--accent) }
svg.edges { position: absolute; left: 0; top: 0; overflow: visible; pointer-events: none }
svg.edges path { fill: none; stroke-linecap: round; stroke-linejoin: round }
svg.edges .hit { stroke: transparent; stroke-width: 34; pointer-events: stroke; cursor: pointer }
svg.edges .e { stroke: var(--accent); stroke-width: 5; opacity: .55; pointer-events: none }
svg.edges .e.back { stroke: var(--back); stroke-dasharray: 14 12 }
svg.edges .ah { fill: var(--accent) } svg.edges .ah.back { fill: var(--back) }
svg.edges .port { fill: var(--accent); stroke: var(--card); stroke-width: 4 } svg.edges .port.back { fill: var(--back) }
svg.edges .lbl { pointer-events: all; cursor: pointer }
svg.edges .lbl rect { fill: var(--accent) } svg.edges .lbl text { fill: var(--accent-fg); font: 600 22px var(--ui) }
svg.edges .lbl.back rect { fill: var(--back) } svg.edges .lbl.back text { fill: #FFFFFF }
svg.edges .eg:hover .e { opacity: 1; stroke-width: 7 }
svg.edges .eg.hi .e { opacity: 1; stroke-width: 11 } svg.edges .eg.hi .lbl rect { stroke: var(--card); stroke-width: 4 }
svg.edges .eg.dim { opacity: .1 } svg.edges .eg.dim:hover { opacity: .6 }
svg.edges.mode-back .e { opacity: .45 }
.shot .hs-on { outline: 6px solid var(--accent) !important; outline-offset: 4px; animation: hsPulse 1.2s ease-in-out 3 }
@keyframes hsPulse { 50% { outline-color: transparent } }
.emode { display: inline-flex; gap: 2px; padding: 2px; border-radius: 9px; background: var(--chrome-2); margin-left: 2px }
.emode button { height: 28px; padding: 0 9px; border-radius: 7px; font-size: 12px; font-weight: 600; color: var(--fg-2) }
.emode button[aria-pressed="true"] { background: var(--chrome); color: var(--accent); box-shadow: 0 1px 2px rgba(0,0,0,.12) }
.hide-edges .emode { opacity: .4; pointer-events: none }
.show-hs .shot [data-go] { outline: 3px solid rgba(18, 122, 94, .75); outline-offset: 2px; box-shadow: 0 0 0 9999px transparent }
.show-hs .shot [data-go]:hover { background-color: rgba(18, 122, 94, .12) }
.hide-edges svg.edges, .hide-spec .spec, .hide-ux .pin { display: none }
.minimap { position: absolute; right: 12px; bottom: 12px; width: 200px; height: 150px; border-radius: 10px; background: var(--chrome); box-shadow: var(--shadow); overflow: hidden; cursor: pointer }
.minimap canvas { width: 100%; height: 100%; display: block }
.hint { position: absolute; left: 12px; bottom: 12px; padding: 6px 10px; border-radius: 8px; background: var(--chrome); box-shadow: var(--shadow); font-size: 12px; color: var(--fg-2); pointer-events: none }
.hint kbd, .keys kbd { font-family: var(--mono); font-size: 11px; padding: 1px 5px; border-radius: 4px; background: var(--chrome-2); color: var(--fg) }

.right { border-left: 1px solid var(--line); background: var(--chrome); display: flex; flex-direction: column; min-height: 0 }
.ins { padding: 16px 18px 28px; display: grid; gap: 18px }
.ins .eyebrow { font-size: 11px; font-weight: 700; letter-spacing: .06em; color: var(--fg-3) }
.ins h2 { margin: 2px 0 0; font-size: 18px; line-height: 1.35; text-wrap: balance }
.ins h2 b { font-family: var(--mono); color: var(--fg-3); font-weight: 600; font-size: 14px; margin-right: 6px }
.ins p { margin: 6px 0 0; color: var(--fg-2) }
.ins h5 { margin: 0 0 6px; font-size: 12px; font-weight: 700; color: var(--fg-2); display: flex; justify-content: space-between }
.ins h5 span { font-family: var(--mono); color: var(--fg-3); font-weight: 500 }
.ins ul { margin: 0; padding-left: 18px; display: grid; gap: 3px }
.row2 { display: flex; gap: 6px; flex-wrap: wrap }
.fl { display: grid; gap: 4px }
.fl div { display: grid; grid-template-columns: 64px minmax(0, 1fr); gap: 8px; align-items: baseline }
.fl b { font-family: var(--mono); font-size: 11px; color: var(--accent) }
.fl small { display: block; color: var(--fg-3); font-size: 11px }
.link { width: 100%; display: flex; align-items: center; gap: 8px; padding: 7px 8px; border-radius: 8px; text-align: left; background: var(--chrome-2) }
.link + .link { margin-top: 4px }
.link:hover { box-shadow: inset 0 0 0 1px var(--accent) }
.link .ar { color: var(--accent); font-weight: 700; flex: none } .link.back .ar { color: var(--fg-3) }
.link .lb { flex: 1; min-width: 0 }
.link .lb small { display: block; color: var(--fg-3); font-size: 11px }
.link .id { font-family: var(--mono); font-size: 11px; color: var(--fg-3); flex: none }
.uxcard { padding: 10px 12px; border-radius: 10px; background: var(--chrome-2); display: grid; gap: 5px }
.uxcard .tt { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; font-weight: 700 }
.uxcard .src { color: var(--fg-3); font-size: 11px }
.uxcard .fx { color: var(--fg-2) }
.uxcard .fx::before { content: "보완 · "; font-weight: 700; color: var(--fg) }
.uxcard .rest { color: var(--mid); font-size: 12px }
.stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px }
.stat { padding: 10px; border-radius: 10px; background: var(--chrome-2) }
.stat b { display: block; font-size: 20px; font-variant-numeric: tabular-nums }
.stat span { color: var(--fg-3); font-size: 11px }
.keys { display: grid; grid-template-columns: auto 1fr; gap: 5px 12px; color: var(--fg-2) }
.keys kbd { justify-self: start; white-space: nowrap }
.btnrow { display: flex; gap: 8px; flex-wrap: wrap }
.uxlist { display: grid; gap: 6px; padding: 10px }
.uxlist button { text-align: left; padding: 10px 12px; border-radius: 10px; background: var(--chrome-2); display: grid; gap: 4px }
.uxlist button:hover { box-shadow: inset 0 0 0 1px var(--accent) }
.uxlist .meta { display: flex; gap: 6px; align-items: center; color: var(--fg-3); font-size: 11px; font-family: var(--mono) }
.uxlist h4 { margin: 8px 2px 2px; font-size: 12px; color: var(--fg-2) }

/* 프로토타입 */
.proto { position: fixed; inset: 0; z-index: 50; background: rgba(8, 14, 11, .84); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)) }
.pbar { display: flex; align-items: center; gap: 8px; color: #E8EEEA; width: min(720px, 100%) }
.pbar .tb { color: #C4CFC9 } .pbar .tb:hover { background: rgba(255, 255, 255, .1); color: #FFFFFF }
.pbar .ttl { flex: 1; min-width: 0; text-align: center; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap }
.pbar .ttl small { font-family: var(--mono); color: #87948D; margin-right: 6px }
.pview { position: relative; border-radius: 12px; overflow: hidden; box-shadow: 0 30px 80px rgba(0, 0, 0, .5) }
.pview .pin-scr { position: absolute; left: 0; top: 0; transform-origin: 0 0 }
.pview [data-go], .pview [data-nav] { cursor: pointer }
.pview [data-go]:hover { outline: 3px solid rgba(79, 203, 164, .9); outline-offset: 2px }
.pview.flash [data-go] { outline: 3px solid rgba(79, 203, 164, .9); outline-offset: 2px; background-color: rgba(79, 203, 164, .18) }
.pfoot { color: #A5B2AB; font-size: 12px; text-align: center }
.pfoot kbd { font-family: var(--mono); background: rgba(255, 255, 255, .1); padding: 1px 5px; border-radius: 4px; color: #E8EEEA }

/* 문서 패널 */
.docs { position: fixed; inset: 0; z-index: 60; background: var(--chrome); color: var(--fg); display: flex; flex-direction: column }
.docs-top { display: flex; align-items: center; gap: 12px; min-height: 56px; border-bottom: 1px solid var(--line); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(12px, env(safe-area-inset-right, 0px)); flex-wrap: wrap }
.docs-tt { display: flex; flex-direction: column; min-width: 0 } .docs-tt b { font-size: 15px } .docs-tt small { color: var(--fg-3); font-size: 12px }
.docs-tabs { display: flex; gap: 4px; flex-wrap: wrap; flex: 1; justify-content: center }
.docs-tabs button { padding: 6px 10px; border-radius: 8px; color: var(--fg-2); font-weight: 600 }
.docs-tabs button[aria-selected="true"] { background: var(--accent-soft); color: var(--accent) }
.docs-body { overflow-y: auto; flex: 1; min-height: 0; padding-block: 24px 80px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)) }
.docs-body > section { max-width: 1180px; margin: 0 auto }
.docs h2 { font-size: 22px; margin: 0 0 6px; text-wrap: balance }
.docs .lead { color: var(--fg-2); max-width: 76ch; margin: 0 0 18px; line-height: 1.6 }
.docs .tbl { overflow-x: auto; border: 1px solid var(--line); border-radius: 12px; margin-bottom: 24px }
.docs table { border-collapse: collapse; width: 100%; font-size: 13px; min-width: 720px }
.docs th, .docs td { text-align: left; padding: 8px 12px; border-top: 1px solid var(--line); vertical-align: top }
.docs thead th { border-top: 0; color: var(--fg-3); font-size: 12px; background: var(--chrome-2); white-space: nowrap; position: sticky; top: 0 }
.docs td.mono { font-family: var(--mono); font-size: 12px; white-space: nowrap; font-variant-numeric: tabular-nums }
.docs td.num { text-align: right; font-family: var(--mono); font-variant-numeric: tabular-nums; white-space: nowrap }
.docs tr.new td { background: var(--accent-soft) }
.docs tr.cond td { color: var(--fg-3) }
.docs tr.tot td { font-weight: 700; background: var(--chrome-2) }
.docs .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 10px; margin-bottom: 20px }
.docs .kpi { border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; display: grid; gap: 2px }
.docs .kpi b { font-size: 24px; font-variant-numeric: tabular-nums } .docs .kpi span { color: var(--fg-3); font-size: 12px } .docs .kpi small { color: var(--fg-2); font-size: 12px }
.bars { display: grid; gap: 6px; margin-bottom: 24px; max-width: 760px }
.bars div { display: grid; grid-template-columns: 150px minmax(0, 1fr) 48px; gap: 10px; align-items: center; font-size: 12px }
.bars i { display: block; height: 14px; border-radius: 3px; background: var(--accent) }
.bars i.add { background: var(--mid) }
.bars em { font-style: normal; font-family: var(--mono); text-align: right; color: var(--fg-2) }
.bartrack { display: flex; gap: 2px; background: var(--chrome-2); border-radius: 3px }
.legend { display: flex; gap: 14px; font-size: 12px; color: var(--fg-2); margin: -12px 0 18px } .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 5px; vertical-align: -1px }
.filter { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 12px }
.filter button { padding: 4px 10px; border-radius: 999px; border: 1px solid var(--line); color: var(--fg-2); font-size: 12px; font-weight: 600 }
.filter button[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); background: var(--accent-soft) }

.only-narrow { display: none }
@media (max-width: 1180px) { .app { grid-template-columns: 240px minmax(0, 1fr) 310px } }
@media (max-width: 900px) {
  .app { grid-template-columns: minmax(0, 1fr) }
  .left, .right { position: fixed; z-index: 30; top: 48px; bottom: 0; width: min(330px, 88vw); box-shadow: var(--shadow) }
  .left { left: 0; transform: translateX(-102%); transition: transform .2s ease }
  .right { right: 0; transform: translateX(102%); transition: transform .2s ease }
  .app.show-left .left, .app.show-right .right { transform: none }
  .only-narrow { display: inline-flex }
  .wide-only { display: none !important }
  .minimap { width: 130px; height: 100px }
  .hint { display: none }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important } }

/* 화면 시안 테마 — 배포 사이트에서 잰 값으로 바꾼다(색 · 글꼴 · 사이드바 · 카드 · 버튼 · 입력 · 배지 · 지도 오버레이).
   클래스 이름(.scr .sb .nv .tp .ct .ph .c .ch .btn .inp .sel .lab .seg .tg .note .t .mapw …)은 엔진 · 검수가 쓰므로 유지한다. */
.scr { width: 1440px; height: 900px; position: relative; background: #F9FAFB; color: #000000; font: 14px/1.5 "Overpass", "Malgun Gothic", "Apple SD Gothic Neo", sans-serif; display: grid; grid-template-columns: 240px minmax(0, 1fr); grid-template-rows: 60px minmax(0, 1fr) 40px; overflow: hidden; text-align: left }
.scr * { box-sizing: border-box }
.scr .sb { grid-row: 1 / 4; background: #FFFFFF; box-shadow: 0 8px 10px 0 rgba(183, 192, 206, .2); z-index: 1; display: flex; flex-direction: column }
.scr .sbh { height: 60px; padding: 0 16px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #F2F4F9 }
.scr .logo { display: flex; align-items: center; gap: 8px; font-size: 12px; font-weight: 300; color: #2E9E6B; white-space: nowrap }
.scr .logo i { width: 20px; height: 20px; border-radius: 5px; background: #1F6F4C }
.scr .logo b { font-weight: 800; color: #1F6F4C }
.scr .burger { width: 24px; display: grid; gap: 4px } .scr .burger i { height: 1.5px; background: #383838 }
.scr .nav { padding: 20px 0 0; display: grid; gap: 0 }
.scr .nv { position: relative; height: 32px; padding: 0 25px; display: flex; align-items: center; gap: 14px; color: #000000; white-space: nowrap }
.scr .nv svg { width: 14px; height: 14px; flex: none; color: #000000 }
.scr .nv.on { color: #2E9E6B } .scr .nv.on svg { color: #2E9E6B }
.scr .nv.on::before { content: ""; position: absolute; left: 0; top: 3px; width: 3px; height: 26px; background: #2E9E6B }
.scr .nv small { font-size: 10.5px; font-weight: 700; line-height: 1; padding: 5px 5px 3px; border-radius: 3px; background: #FFF4D9; color: #A06A00 }
.scr .nv .chev { margin-left: auto; width: 7px; height: 7px; border-right: 1.5px solid #000; border-bottom: 1.5px solid #000; transform: rotate(45deg) translateY(-2px) }
.scr .tp { display: flex; align-items: center; justify-content: flex-end; gap: 14px; padding: 0 25px; background: #FFFFFF; border-bottom: 1px solid #F2F4F9; box-shadow: 3px 0 10px 0 rgba(183, 192, 206, .2) }
.scr .user { display: flex; align-items: center; gap: 14px; color: #535353; font-weight: 700; white-space: nowrap }
.scr .user i { width: 30px; height: 30px; border-radius: 50%; background: #D6D9DE; box-shadow: inset 0 -8px 0 0 #C4C8CF }
.scr .ftr { grid-column: 2; display: flex; align-items: center; padding: 0 25px; border-top: 1px solid #F2F4F9; font-size: 12px; color: #686868; background: #F9FAFB }
.scr .ct { padding: 18px 25px 18px; display: flex; flex-direction: column; gap: 16px; min-height: 0; overflow: hidden }
/* 브레드크럼 행: 사이트에는 페이지 제목이 없고 “홈 > 메뉴명”만 있다 */
.scr .ph { display: flex; align-items: center; gap: 12px; min-height: 26px }
.scr .crumb { font-size: 13px; color: #000000; white-space: nowrap } .scr .crumb a, .scr .crumb .h { color: #007BFF } .scr .crumb s { text-decoration: none; color: #6C757D; margin: 0 8px }
.scr .ph .acts { margin-left: auto; display: flex; gap: 10px; align-items: center }
.scr .c { background: #FFFFFF; border: 1px solid #F2F4F9; border-radius: 4px; box-shadow: 0 0 10px 0 rgba(183, 192, 206, .2); padding: 20px; min-width: 0 }
.scr .ch { display: flex; align-items: center; gap: 8px; font-weight: 600; font-size: 14px; line-height: 1.2; margin-bottom: 14px; color: #000000 }
.scr .ch .n { display: none }
.scr .ch .r { margin-left: auto; display: flex; gap: 6px; align-items: center; font-weight: 400 }
.scr .cnt { font-size: 12px; color: #8A929E; font-weight: 400 }
.scr .btn { height: 31px; padding: 0 12px; border-radius: 3px; display: inline-flex; align-items: center; justify-content: center; gap: 5px; font-weight: 600; font-size: 12.8px; border: 1px solid #2E9E6B; background: #FFFFFF; color: #2E9E6B; white-space: nowrap }
.scr .btn svg { width: 13px; height: 13px }
.scr .btn.pri { background: #2E9E6B; color: #FFFFFF }
.scr .btn.sec { background: #7987A1; border-color: #7987A1; color: #FFFFFF }
.scr .btn.ghost { border-color: transparent; padding: 0 4px }
.scr .btn.sm { height: 26px; padding: 0 9px; font-size: 12px }
.scr .btn.lg { height: 38px; font-size: 14px }
.scr .btn.dis { opacity: .5 }
.scr .btn.danger { color: #FF3366; border-color: #FF3366 }
.scr .inp { height: 31px; border: 1px solid #E8EBF1; border-radius: 3.2px; padding: 0 12px; display: flex; align-items: center; background: #FFFFFF; color: #495057; font-size: 13px; white-space: nowrap; overflow: hidden }
.scr .inp.ro { background: #F4F6F9 }
.scr .inp.err { border-color: #FF3366 }
.scr .inp .u { margin-left: auto; color: #8A929E; font-size: 12px; padding-left: 10px }
.scr .inp.ph-t, .scr .ph-t { color: #B4BAC4 }
.scr .sel { height: 30px; padding: 0 12px; border: 1px solid #E8EBF1; border-radius: 3.2px; display: flex; align-items: center; gap: 8px; background: #FFFFFF; color: #495057; font-size: 13px; white-space: nowrap }
.scr .sel::after { content: ""; width: 6px; height: 6px; border-right: 1.5px solid #343A40; border-bottom: 1.5px solid #343A40; transform: rotate(45deg) translateY(-2px); margin-left: auto }
.scr .lab { font-size: 12px; color: #5B6472; font-weight: 600; margin-bottom: 5px; line-height: 18px }
.scr .lab em { font-style: normal; color: #FF3366 }
.scr .msg, .scr .tiny { font-size: 11px; color: #8A929E; line-height: 16.5px }
.scr .msg { margin-top: 4px } .scr .msg.err { color: #FF3366 } .scr .msg.wrn { color: #A06A00 }
/* 가능/불가/미확인: 사이트의 토글 · 배지 모양을 쓴다 */
.scr .seg { display: inline-flex; gap: 6px; flex-wrap: wrap }
.scr .seg span { height: 30px; padding: 0 12px; display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: #5B6472; border: 1px solid #D5D9E0; border-radius: 4px; background: #FFFFFF; white-space: nowrap }
.scr .seg span::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: #C3C8D1 }
.scr .seg span.on { background: #E8EFFF; border-color: #3D6FD6; color: #1346A6 } .scr .seg span.on::before { background: #3D6FD6 }
.scr .seg span.on.q { background: #F4F6F9; border-color: #7987A1; color: #35404F } .scr .seg span.on.q::before { background: #7987A1 }
.scr .tg { display: inline-flex; align-items: center; height: 19.5px; padding: 3px 5px 1px; border-radius: 3px; font-size: 10.5px; font-weight: 700; line-height: 1; white-space: nowrap }
.scr .t-ok { background: #E1F5EC; color: #0E8A5A } .scr .t-wr { background: #FFF4D9; color: #A06A00 } .scr .t-bad { background: #FFE5EC; color: #E0204F } .scr .t-mu { background: #E9ECEF; color: #212529 } .scr .t-in { background: #E8EFFF; color: #1346A6 }
.scr .t-ops { background: #7987A1; color: #FFFFFF } .scr .t-demo { background: #FFF4D9; color: #A06A00 } .scr .t-na { background: #E9ECEF; color: #5B6472 }
.scr .note { position: relative; display: block; padding: 8px 10px 8px 26px; border-radius: 4px; font-size: 11.5px; line-height: 17.6px; background: #F4F6F9; color: #6B7482 }
.scr .note::before { content: "i"; position: absolute; left: 9px; top: 9px; width: 12px; height: 12px; border-radius: 50%; display: grid; place-items: center; font-size: 9px; font-weight: 800; background: #8A929E; color: #FFFFFF }
.scr .note.w { background: #FFF8E6; color: #8A5C00 } .scr .note.w::before { content: "!"; background: #D69A00 }
.scr .note.e { background: #FFEEF2; color: #C0163F } .scr .note.e::before { content: "!"; background: #FF3366 }
.scr .note.g { background: #E9F7F0; color: #0E7A50 } .scr .note.g::before { content: "✓"; background: #10B759 }
.scr .note.i { background: #F4F6F9; color: #6B7482 }
.scr table.t { width: 100%; border-collapse: collapse; font-size: 13px; color: #212529 }
.scr table.t th { text-align: left; font-size: 13px; color: #000000; font-weight: 700; padding: 10px 12px; border-bottom: 1px solid #E8EBF1; white-space: nowrap }
.scr table.t td { padding: 10px 12px; border-bottom: 1px solid #E8EBF1; white-space: nowrap }
.scr table.t tr:last-child td { border-bottom: 0 }
.scr table.t.tight td { padding: 6px 8px }
.scr table.t.wrap td { white-space: normal } .scr table.t.wrap td .btn, .scr table.t.wrap td .tg { white-space: nowrap } .scr table.t.wrap td:first-child { white-space: nowrap }
.scr table.t tr.on td { background: #F3F4FE }
.scr table.t td.r, .scr table.t th.r { text-align: right; font-variant-numeric: tabular-nums }
/* 현황 카드: 기존 홈 카드(라벨 · 파란 큰 값 · 보조 문구), 아이콘 없음 */
.scr .kpi { display: block; padding: 20px 24px }
.scr .kpi .ic { display: none }
.scr .kpi .k { font-size: 14px; font-weight: 600; color: #000000; display: flex; gap: 6px; align-items: center }
.scr .kpi .v { font-size: 28px; font-weight: 600; line-height: 36px; color: #2E9E6B; margin: 2px 0 2px; font-variant-numeric: tabular-nums }
.scr .kpi .s { font-size: 13px; color: #686868 }
.scr .stp { display: flex; align-items: center; gap: 8px; font-size: 12px; color: #8A929E; white-space: nowrap }
.scr .stp b { width: 18px; height: 18px; border-radius: 50%; border: 1px solid #C3C8D1; color: #8A929E; display: grid; place-items: center; font-size: 10.5px; font-weight: 700 }
.scr .stp .on { color: #2E9E6B; font-weight: 600 } .scr .stp .on b { background: #2E9E6B; border-color: #2E9E6B; color: #FFFFFF }
.scr .stp .done { color: #5B6472 } .scr .stp .done b { border-color: #7987A1; color: #7987A1 }
.scr .stp i { width: 14px; height: 1px; background: #C3C8D1 }
.scr .stp em { font-style: normal; font-size: 10.5px }
.scr .tabsx { display: flex; gap: 2px; border-bottom: 1px solid #E8EBF1 }
.scr .tabsx span { padding: 8px 16px; font-size: 13px; color: #5B6472; border: 1px solid transparent; border-radius: 4px 4px 0 0; margin-bottom: -1px }
.scr .tabsx span.on { color: #2E9E6B; font-weight: 600; background: #FFFFFF; border-color: #E8EBF1 #E8EBF1 #FFFFFF }
/* 지도: 카카오 지도 톤(연한 지형 · 노란 도로 · 하늘색 하천) + 사이트의 오버레이 박스 */
.scr .mapw { position: relative; border-radius: 0; overflow: hidden; background: #EEF1EC }
.scr .mapw svg.map { position: absolute; inset: 0; width: 100%; height: 100% }
.scr .zoom { position: absolute; right: 8px; top: 8px; width: 28px; background: #FFFFFF; border: 1px solid #D5D9E0; border-radius: 3px; display: grid; justify-items: center; font-size: 16px; color: #333333; box-shadow: 0 1px 2px rgba(0, 0, 0, .12) }
.scr .zoom span { height: 26px; line-height: 26px } .scr .zoom i { width: 3px; height: 62px; background: #E0E0E0; position: relative; margin: 2px 0 } .scr .zoom i::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 42px; background: #3396FF } .scr .zoom i::before { content: ""; position: absolute; left: -6px; top: 14px; width: 15px; height: 6px; background: #3396FF; border-radius: 2px; z-index: 1 }
.scr .scale { position: absolute; left: 8px; bottom: 6px; display: flex; align-items: flex-end; gap: 4px; font: 700 10px/1 "Overpass", sans-serif; color: #333333 } .scr .scale i { width: 46px; height: 5px; border: 1.5px solid #333333; border-top: 0 } .scr .scale b { font-size: 11px; letter-spacing: -.02em }
.scr .lyr { position: absolute; left: 10px; top: 10px; display: flex; gap: 6px }
.scr .lyr span { height: 28px; padding: 0 9px; border-radius: 4px; background: #E8EFFF; border: 1px solid #3D6FD6; color: #1346A6; display: inline-flex; align-items: center; gap: 6px; font-size: 12px }
.scr .lyr span::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: #3D6FD6 }
.scr .lyr span.no { background: #FFFFFF; border-color: #D5D9E0; color: #5B6472 } .scr .lyr span.no::before { background: #C3C8D1 }
.scr .lgd, .scr .ibox { position: absolute; background: rgba(255, 255, 255, .95); border: 1px solid #DFE3E8; border-radius: 6px; box-shadow: 0 2px 10px 0 rgba(28, 46, 74, .12); padding: 10px 12px; font-size: 11px; line-height: 16.5px; color: #35404F; display: grid; gap: 4px }
.scr .lgd { right: 10px; bottom: 10px } .scr .ibox { left: 10px; top: 10px; min-width: 150px }
.scr .lgd b, .scr .ibox b { font-weight: 700 }
.scr .lgd div, .scr .ibox div { display: flex; gap: 6px; align-items: center }
.scr .ibox div span:first-child { color: #8A929E; width: 56px }
.scr .lgd i { width: 16px; height: 10px; border-radius: 2px; flex: none }
.scr .mtag { position: absolute; left: 92px; bottom: 5px; font-size: 10px; color: #6B7482 }
.scr .row { display: flex; gap: 20px; min-height: 0 }
.scr .g { display: grid; gap: 20px; min-height: 0 }
.scr .fr { display: grid; grid-template-columns: 110px minmax(0, 1fr); gap: 8px 10px; align-items: center }
.scr .fr > .lab { margin: 0 }
.scr .fr { gap: 5px 10px } .scr .fr .seg span { height: 24px } .scr .fr .inp, .scr .fr .sel { height: 26px }
.scr .ck { display: flex; align-items: center; gap: 7px; font-size: 13px; color: #212529 }
.scr .ck i { width: 15px; height: 15px; border-radius: 2px; border: 1px solid #ADB5BD; background: #FFFFFF; flex: none; display: grid; place-items: center; font-style: normal; font-size: 10px; color: #FFFFFF }
.scr .ck i.on { background: #2E9E6B; border-color: #2E9E6B } .scr .ck i.on::after { content: "✓" }
.scr .ck i.lock { background: #E9ECEF }
.scr .ck.dis { color: #ADB5BD }
/* 목록: 사이트의 목록 항목 패턴 */
.scr .li { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-bottom: 1px solid #EEF1F5; border-left: 3px solid transparent; background: #FFFFFF }
.scr .li.on { border-left-color: #2E9E6B; background: #F3F4FE }
.scr .li .tt { font-weight: 600; font-size: 13px; color: #35404F } .scr .li .sub { font-size: 11px; color: #8A929E }
.scr .lbox { border: 1px solid #E8EBF1; border-radius: 3px; overflow: hidden }
.scr .lbox .li:last-child { border-bottom: 0 }
.scr .shade { position: absolute; inset: 0; background: rgba(0, 0, 0, .4); z-index: 5 }
.scr .modal { position: absolute; z-index: 6; background: #FFFFFF; border-radius: 4px; box-shadow: 0 6px 30px rgba(0, 0, 0, .25); padding: 0; display: flex; flex-direction: column }
.scr .modal h3 { margin: 0; padding: 16px 20px; font-size: 15px; font-weight: 600; display: flex; align-items: center; gap: 8px; border-bottom: 1px solid #E8EBF1 }
.scr .modal .mb { padding: 18px 20px; display: flex; flex-direction: column; gap: 12px; flex: 1; min-height: 0 }
.scr .modal .x { margin-left: auto; width: 24px; height: 24px; display: grid; place-items: center; color: #6C757D; font-size: 16px; font-weight: 400 }
.scr .modal .foot { display: flex; gap: 8px; justify-content: flex-end; align-items: center; padding: 12px 20px; border-top: 1px solid #E8EBF1 }
.scr .dimmed { position: absolute; inset: 0 }
.scr .mono { font-family: "Overpass Mono", "Overpass", ui-monospace, monospace; font-size: 12px }
.scr .toast { position: absolute; z-index: 7; right: 25px; top: 76px; background: #FFFFFF; color: #212529; border-radius: 4px; padding: 12px 16px; font-size: 13px; display: flex; gap: 10px; align-items: center; box-shadow: 0 0 10px rgba(0, 0, 0, .2); border-left: 4px solid #10B759 }
.scr .toast b { color: #000000 }
.scr .demo { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: #A06A00 }

[hidden] { display: none !important }
/* ===== 화면설계서(SB) 보기: 관리자 SB 형식 — 머리줄 · 화면(번호 마커) · Description 표 · 상태 예시 · 흐름 ===== */
.mode { display: flex; gap: 2px; padding: 3px; border-radius: 9px; background: var(--chrome-2); margin-left: 10px; flex: none }
.mode button { height: 26px; padding: 0 12px; border-radius: 7px; font-weight: 600; color: var(--fg-2); white-space: nowrap }
.mode button[aria-selected="true"] { background: var(--chrome); color: var(--fg); box-shadow: 0 1px 2px rgba(0, 0, 0, .12) }
.sbv { display: none; grid-column: 1 / -1; grid-row: 2; min-height: 0; grid-template-columns: 250px minmax(0, 1fr); background: var(--canvas) }
.app.mode-sb .sbv { display: grid }
.app.mode-sb .left, .app.mode-sb .stage, .app.mode-sb .right, .app.mode-sb .map-only { display: none !important }
.sbx { border-right: 1px solid var(--line); background: var(--chrome); overflow-y: auto; padding: 8px 6px 16px }
.sbx h4 { margin: 10px 8px 4px; font-size: 11.5px; font-weight: 700; color: var(--fg-3); letter-spacing: .02em }
.sbx button { width: 100%; display: grid; grid-template-columns: 46px minmax(0, 1fr); gap: 6px; align-items: baseline; padding: 6px 8px; border-radius: 7px; text-align: left }
.sbx button:hover { background: var(--chrome-2) }
.sbx button[aria-current="true"] { background: var(--accent-soft) }
.sbx button span:first-child { font-family: var(--mono); font-size: 11px; color: var(--fg-3) }
.sbx button span:last-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap }
.sbx button small { grid-column: 2; font-size: 11px; color: var(--fg-3); margin-top: -3px }
.sbmain { overflow: auto; min-width: 0; padding: 20px 24px 40px }
.sbnav { display: flex; align-items: center; gap: 8px; max-width: 1640px; margin: 0 auto 12px }
.sbnav .t { flex: 1; min-width: 0; font-size: 12px; color: var(--fg-3); overflow: hidden; text-overflow: ellipsis; white-space: nowrap }
.sbnav .tb { border: 1px solid var(--line); background: var(--chrome) }

/* 용지: 문서이므로 테마와 무관하게 흰 바탕 */
.sheet { max-width: 1640px; margin: 0 auto; background: #FFFFFF; color: #1E1E1E; border-radius: 6px; box-shadow: var(--shadow); padding: 22px 26px 26px; font: 13px/1.55 "IBM Plex Sans KR", "Malgun Gothic", sans-serif }
.sh-top { display: flex; align-items: baseline; gap: 14px; border-bottom: 2px solid #1E1E1E; padding-bottom: 10px; margin-bottom: 16px; flex-wrap: wrap }

.sh-top .path { font-size: 19px; color: #8A8A8A; font-weight: 500 }
.sh-top .meta { margin-left: auto; display: flex; gap: 6px; flex-wrap: wrap; align-items: center }
.sh-chip { display: inline-flex; align-items: center; height: 22px; padding: 0 8px; border-radius: 4px; background: #F1F1F1; color: #444; font-size: 11.5px; font-weight: 600; white-space: nowrap }
.sh-chip.new { background: #FFECEC; color: #C81E1E } .sh-chip.old { background: #E9EEF7; color: #34507A } .sh-chip.cond { background: #FFF4D9; color: #8A5A00 }
.sh-chip.mono { font-family: var(--mono); font-weight: 500 }
.sh-purpose { margin: -4px 0 14px; color: #444; font-size: 13px }
.sh-body { display: grid; grid-template-columns: minmax(0, 1fr) 420px; gap: 22px; align-items: start }
@media (max-width: 1180px) { .sh-body { grid-template-columns: minmax(0, 1fr) } }

.sb-shot { position: relative; border: 1px solid #D9D9D9; overflow: hidden; background: #F9FAFB }
.sb-scale { position: absolute; left: 0; top: 0; width: 1440px; height: 900px; transform-origin: 0 0 }
.sb-ov { position: absolute; inset: 0; pointer-events: none; z-index: 20 }

  document.addEventListener('keydown', (e) => {
    if (e.target.closest && e.target.closest('input,textarea,select')) return;
    if (!$('proto').hidden) { if (e.key === 'Escape') closeProto(); if (e.key === 'ArrowLeft') $('pBack').click(); return; }
    if (!$('docs').hidden) { if (e.key === 'Escape') $('docs').hidden = true; return; }
    if (e.key === '1') fitAll(); else if (e.key === '2' && sel) focus(sel); else if (e.key === 'p' || e.key === 'P') openProto(sel || 'D1'); else if (e.key === 'd' || e.key === 'D') openDocs(); else if (e.key === 'Escape') select(null);
  });
  window.addEventListener('resize', () => { if (!$('proto').hidden) pScale(); drawMini(); });
  const mq = window.matchMedia('(prefers-color-scheme: dark)'); if (mq.addEventListener) mq.addEventListener('change', drawMini);

  build(); renderLeft(); renderIns(); fitAll();
  let relay = 0; const re = () => { clearTimeout(relay); relay = setTimeout(() => { layout(); drawMini(); }, 150); };
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(re);
  window.addEventListener('load', re);
})();
</script>
