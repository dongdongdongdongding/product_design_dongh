name: validate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: plugin manifest JSON
        run: |
          python -c "import json; json.load(open('.claude-plugin/plugin.json')); json.load(open('.claude-plugin/marketplace.json'))"
      - name: skill / command frontmatter
        run: |
          pip install pyyaml -q
          python - <<'EOF'
          import glob, yaml
          for f in glob.glob('skills/*/SKILL.md') + glob.glob('commands/*.md'):
              d = yaml.safe_load(open(f, encoding='utf8').read().split('---')[1])
              assert isinstance(d.get('description'), str), f
              assert not isinstance(d.get('argument-hint', ''), list), f + ' argument-hint must be a quoted string'
              if f.startswith('skills'):
                  assert d.get('name'), f
          print('frontmatter ok')
          EOF
      - name: install script (dry run)
        run: python scripts/install_skills.py --to /tmp/skills && test -f /tmp/skills/screen-spec-kit/SKILL.md
      - name: docs consistency (demo)
        run: python scripts/check_docs.py --docs examples/demo-park/docs --screens D1,F1,F2,B1,B2
      - name: docs consistency (starter)
        run: python scripts/check_docs.py --docs templates/project-starter/docs
      - name: build demo
        run: python scripts/build_kit.py examples/demo-park
      - name: build starter
        run: python scripts/build_kit.py templates/project-starter
      - name: export design
        run: node scripts/export_design.mjs examples/demo-park /tmp/design-out
      - name: JS syntax
        run: |
          for f in engine/*.js scripts/audits/*.js examples/demo-park/*.js templates/project-starter/*.js; do node --check "$f" 2>/dev/null || node -e "new Function(require('fs').readFileSync('$f','utf8'))" || exit 1; done
