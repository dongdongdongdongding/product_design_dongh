<style>

:root {

  --high: #C8361F; --high-soft: #FBE9E5; --mid: #A65A07; --mid-soft: #FDF1DF; --low: #4D5E78; --low-soft: #EBEFF5; --good: #127A5E; --good-soft: #E2F3EC;

  --back: #69766F; --section: rgba(255, 255, 255, .025); --section-line: rgba(255, 255, 255, .07);
  --card: #1F2522; --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 8px 28px rgba(0, 0, 0, .35);
  --high: #FF8A73; --high-soft: rgba(255, 138, 115, .14); --mid: #F2B45A; --mid-soft: rgba(242, 180, 90, .14); --low: #A9B6CC; --low-soft: rgba(169, 182, 204, .14); --good: #4FCBA4; --good-soft: rgba(79, 203, 164, .14);
  color-scheme: dark } }
:root[data-theme="dark"] {
  --canvas: #171C1A; --dot: #29312D; --chrome: #1F2522; --chrome-2: #272E2B; --line: #343D38;
  --fg: #E8EEEA; --fg-2: #A5B2AB; --fg-3: #7B8882;
  --accent: #4FCBA4; --accent-soft: rgba(79, 203, 164, .16); --accent-fg: #06261C;

html, body { height: 100%; overflow: hidden }
body { background: var(--chrome); color: var(--fg); font: 13px/1.5 var(--ui); -webkit-font-smoothing: antialiased }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer }
button:focus-visible, [tabindex]:focus-visible, a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px }
.app { height: 100%; display: grid; grid-template-columns: 268px minmax(0, 1fr) 360px; grid-template-rows: 48px minmax(0, 1fr) }
.top { grid-column: 1 / -1; display: flex; align-items: center; gap: 6px; border-bottom: 1px solid var(--line); background: var(--chrome); padding-left: max(12px, env(safe-area-inset-left, 0px)); padding-right: max(12px, env(safe-area-inset-right, 0px)); min-width: 0 }

.tb svg { width: 16px; height: 16px; flex: none }
.zoomval { font-family: var(--mono); font-size: 12px; min-width: 52px; font-variant-numeric: tabular-nums }

.layers { display: flex; gap: 2px }
@media (max-width: 1480px) { .brand small { display: none } }

.left { border-right: 1px solid var(--line); background: var(--chrome); display: flex; flex-direction: column; min-height: 0 }
.tabs { display: flex; gap: 4px; padding: 8px 10px; border-bottom: 1px solid var(--line) }

.scroll { overflow-y: auto; min-height: 0; flex: 1 }
.flow { padding: 6px 6px 10px }
.flow h3 { margin: 0; padding: 8px 8px 4px; font-size: 12px; font-weight: 700; color: var(--fg-2); display: flex; justify-content: space-between; gap: 8px; cursor: pointer; border-radius: 6px }
.flow h3:hover { color: var(--fg) }
.flow h3 span { font-family: var(--mono); font-weight: 500; color: var(--fg-3) }
.item { width: 100%; display: flex; align-items: center; gap: 8px; padding: 6px 8px; border-radius: 7px; text-align: left; color: var(--fg) }
.item:hover { background: var(--chrome-2) }
.item[aria-current="true"] { background: var(--accent-soft) }
.item .id { font-family: var(--mono); font-size: 11px; color: var(--fg-3); width: 26px; flex: none }
.item .nm { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap }
.item .kd { font-size: 11px; color: var(--fg-3); flex: none }
.dot { width: 8px; height: 8px; border-radius: 50%; flex: none }
.dot.high { background: var(--high) } .dot.mid { background: var(--mid) } .dot.low { background: var(--low) } .dot.ok { background: var(--good) }

.stage { position: relative; overflow: hidden; background-color: var(--canvas); touch-action: none; cursor: grab; min-width: 0; -webkit-user-select: none; user-select: none }

.stage.dragging { cursor: grabbing }
.grid { position: absolute; inset: 0; pointer-events: none; background-image: radial-gradient(var(--dot) 1px, transparent 1.2px) }
.world { position: absolute; left: 0; top: 0; transform-origin: 0 0; will-change: transform }
.section { position: absolute; border-radius: 36px; background: var(--section); box-shadow: inset 0 0 0 1px var(--section-line) }
.section h2 { position: absolute; left: 48px; top: 40px; margin: 0; font-size: 64px; line-height: 1.15; font-weight: 700; letter-spacing: -.01em; white-space: nowrap }
.section h2 b { font-family: var(--mono); font-weight: 600; color: var(--fg-3); font-size: 40px; margin-right: 20px }
.section p { position: absolute; left: 50px; top: 130px; margin: 0; font-size: 28px; color: var(--fg-2); white-space: nowrap }
.frame { position: absolute; width: 1440px }
.frame .ft { position: absolute; left: 2px; bottom: calc(100% + 14px); display: flex; gap: 14px; align-items: baseline; white-space: nowrap; font-size: 26px; font-weight: 600; color: var(--fg-2); cursor: pointer }
.frame .ft b { font-family: var(--mono); font-weight: 600; color: var(--fg-3) }
.frame .ft i { font-style: normal; font-size: 18px; font-weight: 600; padding: 2px 10px; border-radius: 8px; background: var(--chrome-2); color: var(--fg-2) }
.frame.sel .ft, .frame.sel .ft b { color: var(--accent) }
.shot { position: relative; width: 1440px; height: 900px; border-radius: 18px; overflow: hidden; box-shadow: var(--shadow); cursor: pointer }
.frame.sel .shot { box-shadow: 0 0 0 6px var(--accent), var(--shadow) }
.pin { position: absolute; top: -18px; right: -18px; min-width: 44px; height: 44px; padding: 0 14px; border-radius: 22px; display: flex; align-items: center; justify-content: center; gap: 6px; font-weight: 700; font-size: 20px; color: #FFFFFF; box-shadow: 0 0 0 4px var(--canvas); cursor: pointer; z-index: 2 }
.pin.high { background: #C8361F } .pin.mid { background: #B86508 } .pin.low { background: #55667F } .pin.ok { background: #127A5E }
.spec { position: absolute; left: 0; width: 1440px; background: var(--card); border-radius: 24px; box-shadow: var(--shadow); padding: 30px 34px; font-size: 21px; line-height: 1.55; cursor: pointer; display: grid; grid-template-columns: 1.1fr 1fr 1fr; gap: 28px }
.spec h4 { grid-column: 1 / -1; margin: 0; font-size: 28px; font-weight: 700; display: flex; gap: 14px; align-items: baseline; flex-wrap: wrap }
.spec h4 b { font-family: var(--mono); color: var(--fg-3); font-weight: 600; font-size: 22px }
.spec h4 small { font-size: 20px; font-weight: 500; color: var(--fg-2) }
.spec dt { font-size: 16px; font-weight: 700; color: var(--fg-3); letter-spacing: .05em; margin-bottom: 6px }
.spec dd { margin: 0 0 16px }
.spec ul { margin: 0; padding-left: 24px; display: grid; gap: 4px }
.spec .chips { display: flex; gap: 8px; flex-wrap: wrap }
.spec .chips .chip { height: 30px; font-size: 16px; padding: 0 10px }
.chip { display: inline-flex; align-items: center; height: 22px; padding: 0 8px; border-radius: 6px; font-size: 12px; font-weight: 700; white-space: nowrap; flex: none; background: var(--chrome-2); color: var(--fg-2) }
.chip.high { background: var(--high-soft); color: var(--high) } .chip.mid { background: var(--mid-soft); color: var(--mid) } .chip.low { background: var(--low-soft); color: var(--low) } .chip.good { background: var(--good-soft); color: var(--good) } .chip.acc { background: var(--accent-soft); color: var(--accent) }
svg.edges { position: absolute; left: 0; top: 0; overflow: visible; pointer-events: none }
svg.edges path { fill: none; stroke-linecap: round; stroke-linejoin: round }
svg.edges .hit { stroke: transparent; stroke-width: 34; pointer-events: stroke; cursor: pointer }
svg.edges .e { stroke: var(--accent); stroke-width: 5; opacity: .55; pointer-events: none }
svg.edges .e.back { stroke: var(--back); stroke-dasharray: 14 12 }
svg.edges .ah { fill: var(--accent) } svg.edges .ah.back { fill: var(--back) }
svg.edges .port { fill: var(--accent); stroke: var(--card); stroke-width: 4 } svg.edges .port.back { fill: var(--back) }
svg.edges .lbl { pointer-events: all; cursor: pointer }
svg.edges .lbl rect { fill: var(--accent) } svg.edges .lbl text { fill: var(--accent-fg); font: 600 22px var(--ui) }
svg.edges .lbl.back rect { fill: var(--back) } svg.edges .lbl.back text { fill: #FFFFFF }
svg.edges .eg:hover .e { opacity: 1; stroke-width: 7 }
svg.edges .eg.hi .e { opacity: 1; stroke-width: 11 } svg.edges .eg.hi .lbl rect { stroke: var(--card); stroke-width: 4 }
svg.edges .eg.dim { opacity: .1 } svg.edges .eg.dim:hover { opacity: .6 }
svg.edges.mode-back .e { opacity: .45 }
.shot .hs-on { outline: 6px solid var(--accent) !important; outline-offset: 4px; animation: hsPulse 1.2s ease-in-out 3 }
@keyframes hsPulse { 50% { outline-color: transparent } }
.emode { display: inline-flex; gap: 2px; padding: 2px; border-radius: 9px; background: var(--chrome-2); margin-left: 2px }
.emode button { height: 28px; padding: 0 9px; border-radius: 7px; font-size: 12px; font-weight: 600; color: var(--fg-2) }
.emode button[aria-pressed="true"] { background: var(--chrome); color: var(--accent); box-shadow: 0 1px 2px rgba(0,0,0,.12) }
.hide-edges .emode { opacity: .4; pointer-events: none }
.show-hs .shot [data-go] { outline: 3px solid rgba(18, 122, 94, .75); outline-offset: 2px; box-shadow: 0 0 0 9999px transparent }
.show-hs .shot [data-go]:hover { background-color: rgba(18, 122, 94, .12) }
.hide-edges svg.edges, .hide-spec .spec, .hide-ux .pin { display: none }
.minimap { position: absolute; right: 12px; bottom: 12px; width: 200px; height: 150px; border-radius: 10px; background: var(--chrome); box-shadow: var(--shadow); overflow: hidden; cursor: pointer }
.minimap canvas { width: 100%; height: 100%; display: block }
.hint { position: absolute; left: 12px; bottom: 12px; padding: 6px 10px; border-radius: 8px; background: var(--chrome); box-shadow: var(--shadow); font-size: 12px; color: var(--fg-2); pointer-events: none }

.right { border-left: 1px solid var(--line); background: var(--chrome); display: flex; flex-direction: column; min-height: 0 }
.ins { padding: 16px 18px 28px; display: grid; gap: 18px }

.ins h2 { margin: 2px 0 0; font-size: 18px; line-height: 1.35; text-wrap: balance }
.ins h2 b { font-family: var(--mono); color: var(--fg-3); font-weight: 600; font-size: 14px; margin-right: 6px }
.ins p { margin: 6px 0 0; color: var(--fg-2) }
.ins h5 { margin: 0 0 6px; font-size: 12px; font-weight: 700; color: var(--fg-2); display: flex; justify-content: space-between }
.ins h5 span { font-family: var(--mono); color: var(--fg-3); font-weight: 500 }
.ins ul { margin: 0; padding-left: 18px; display: grid; gap: 3px }
.row2 { display: flex; gap: 6px; flex-wrap: wrap }
.fl { display: grid; gap: 4px }
.fl div { display: grid; grid-template-columns: 64px minmax(0, 1fr); gap: 8px; align-items: baseline }
.fl b { font-family: var(--mono); font-size: 11px; color: var(--accent) }
.fl small { display: block; color: var(--fg-3); font-size: 11px }
.link { width: 100%; display: flex; align-items: center; gap: 8px; padding: 7px 8px; border-radius: 8px; text-align: left; background: var(--chrome-2) }
.link + .link { margin-top: 4px }
.link:hover { box-shadow: inset 0 0 0 1px var(--accent) }
.link .ar { color: var(--accent); font-weight: 700; flex: none } .link.back .ar { color: var(--fg-3) }
.link .lb { flex: 1; min-width: 0 }
.link .lb small { display: block; color: var(--fg-3); font-size: 11px }
.link .id { font-family: var(--mono); font-size: 11px; color: var(--fg-3); flex: none }
.uxcard { padding: 10px 12px; border-radius: 10px; background: var(--chrome-2); display: grid; gap: 5px }
.uxcard .tt { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; font-weight: 700 }

.uxcard .fx { color: var(--fg-2) }
.uxcard .fx::before { content: "보완 · "; font-weight: 700; color: var(--fg) }
.uxcard .rest { color: var(--mid); font-size: 12px }
.stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px }
.stat { padding: 10px; border-radius: 10px; background: var(--chrome-2) }
.stat b { display: block; font-size: 20px; font-variant-numeric: tabular-nums }

.keys { display: grid; grid-template-columns: auto 1fr; gap: 5px 12px; color: var(--fg-2) }

.btnrow { display: flex; gap: 8px; flex-wrap: wrap }

/* 프로토타입 */
.proto { position: fixed; inset: 0; z-index: 50; background: rgba(8, 14, 11, .84); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)) }
.pbar { display: flex; align-items: center; gap: 8px; color: #E8EEEA; width: min(720px, 100%) }
.pbar .tb { color: #C4CFC9 } .pbar .tb:hover { background: rgba(255, 255, 255, .1); color: #FFFFFF }
.pbar .ttl { flex: 1; min-width: 0; text-align: center; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap }

.pview { position: relative; border-radius: 12px; overflow: hidden; box-shadow: 0 30px 80px rgba(0, 0, 0, .5) }

.pview [data-go]:hover { outline: 3px solid rgba(79, 203, 164, .9); outline-offset: 2px }

.pfoot kbd { font-family: var(--mono); background: rgba(255, 255, 255, .1); padding: 1px 5px; border-radius: 4px; color: #E8EEEA }

/* 문서 패널 */
.docs { position: fixed; inset: 0; z-index: 60; background: var(--chrome); color: var(--fg); display: flex; flex-direction: column }
.docs-top { display: flex; align-items: center; gap: 12px; min-height: 56px; border-bottom: 1px solid var(--line); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(12px, env(safe-area-inset-right, 0px)); flex-wrap: wrap }
.docs-tt { display: flex; flex-direction: column; min-width: 0 } .docs-tt b { font-size: 15px } .docs-tt small { color: var(--fg-3); font-size: 12px }
.docs-tabs { display: flex; gap: 4px; flex-wrap: wrap; flex: 1; justify-content: center }
.docs-tabs button { padding: 6px 10px; border-radius: 8px; color: var(--fg-2); font-weight: 600 }
.docs-tabs button[aria-selected="true"] { background: var(--accent-soft); color: var(--accent) }
.docs-body { overflow-y: auto; flex: 1; min-height: 0; padding-block: 24px 80px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)) }
.docs-body > section { max-width: 1180px; margin: 0 auto }
.docs h2 { font-size: 22px; margin: 0 0 6px; text-wrap: balance }

.docs td.mono { font-family: var(--mono); font-size: 12px; white-space: nowrap; font-variant-numeric: tabular-nums }
.docs td.num { text-align: right; font-family: var(--mono); font-variant-numeric: tabular-nums; white-space: nowrap }
.docs tr.new td { background: var(--accent-soft) }
.docs tr.cond td { color: var(--fg-3) }
.docs tr.tot td { font-weight: 700; background: var(--chrome-2) }
.docs .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 10px; margin-bottom: 20px }
.docs .kpi { border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; display: grid; gap: 2px }
.docs .kpi b { font-size: 24px; font-variant-numeric: tabular-nums } .docs .kpi span { color: var(--fg-3); font-size: 12px } .docs .kpi small { color: var(--fg-2); font-size: 12px }
.bars { display: grid; gap: 6px; margin-bottom: 24px; max-width: 760px }
.bars div { display: grid; grid-template-columns: 150px minmax(0, 1fr) 48px; gap: 10px; align-items: center; font-size: 12px }
.bars i { display: block; height: 14px; border-radius: 3px; background: var(--accent) }
.bars i.add { background: var(--mid) }
.bars em { font-style: normal; font-family: var(--mono); text-align: right; color: var(--fg-2) }
.bartrack { display: flex; gap: 2px; background: var(--chrome-2); border-radius: 3px }
.legend { display: flex; gap: 14px; font-size: 12px; color: var(--fg-2); margin: -12px 0 18px } .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 5px; vertical-align: -1px }
.filter { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 12px }
.filter button { padding: 4px 10px; border-radius: 999px; border: 1px solid var(--line); color: var(--fg-2); font-size: 12px; font-weight: 600 }
